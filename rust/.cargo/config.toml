# 限制编译与测试并发，防止多轨并行时整机卡死；单轨或 CI 要更快，用环境变量 CARGO_BUILD_JOBS / RUST_TEST_THREADS 覆盖。
# Cap build/test parallelism; override with CARGO_BUILD_JOBS / RUST_TEST_THREADS.
[build]
jobs = 3

# 关增量编译、调试信息只留行号表，让 target/ 小一半；改一行后的重编会慢一些。
# Smaller target/: no incremental builds, line tables only; rebuilds after a one-line edit are slower.
incremental = false

[profile.dev]
debug = "line-tables-only"

[env]
RUST_TEST_THREADS = "4"
