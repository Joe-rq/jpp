[package]
name = "jpp-cell"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "J++ cell graph (L3b): the five kinds of cells, versions and dependency edges, dirty marking, two-layer cutoff, debts and handoff, multi-writer cells, reducers and claims"

[dependencies]
# B198：允许 ir、value、effects、ledger；C1 只用到 ir，其余到 C2、C3 真用时再加
jpp-ir = { path = "../jpp-ir" }

[dev-dependencies]
# 跨 crate 对照：同一笔欠账在 jpp-cell 与 jpp-ledger 算出的记号相等（主控 Z0519）
jpp-ledger = { path = "../jpp-ledger" }
