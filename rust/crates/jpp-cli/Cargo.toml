[package]
name = "jpp-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "jpp"
path = "src/main.rs"

[dependencies]
jpp-syntax = { path = "../jpp-syntax" }
jpp-core = { path = "../jpp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# 透传到 jpp-core 的 `live`：`--backend live` 只在这个 feature 开着时才能真的发请求。
live = ["jpp-core/live"]
