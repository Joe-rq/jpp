[package]
name = "jpp-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "J++ core: common program representation, checker, interpreter, effects, ledger"

[dependencies]
jpp-ir = { path = "../jpp-ir" }
jpp-value = { path = "../jpp-value" }
jpp-effects = { path = "../jpp-effects" }
jpp-ledger = { path = "../jpp-ledger" }
jpp-calib = { path = "../jpp-calib" }
jpp-check = { path = "../jpp-check" }
# 步 13a：解释器暂时直接依赖规划（`Interp.passes` 在 `run` 入口算成计划，钩子默认 `jpp_plan::Hooks`）。
# 步 14a 拆出 `jpp-runtime` 时撤掉：计划由宿主算、钩子经 `Ports.hooks` 注入（`20` §2.2 第 3 条）。
jpp-plan = { path = "../jpp-plan" }
# 外观层（步 12d）：`jpp-core` 现在兼作外观，组装名字表并经 `jpp_syntax::lower` 把表层程序降到 IR。
# 解释器（`interp/`，目标 `jpp-runtime`）不引用它（`20` §2.2 第 3 条），拆出 `jpp-runtime` 时依赖随外观走。
jpp-syntax = { path = "../jpp-syntax" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"], optional = true }

[features]
default = []
live = ["ureq"]

[dev-dependencies]
# 对照基准 tests/oracle/oracle.json 是 Python 内核跑出来的，测试要读它
serde_json = "1"
