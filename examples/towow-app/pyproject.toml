[project]
name = "towow-net"
version = "0.1.0"
description = "通爻网：J++x 实验语言 + 网络程序 + 宿主（MCP / CLI / 事件流）"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10", "fastapi>=0.115", "uvicorn>=0.30", "mcp>=2.0", "httpx>=0.27",
  "numpy>=2.0", "networkx>=3.3", "hnswlib>=0.8",
]

[project.optional-dependencies]
bge = ["sentence-transformers>=3.0", "torch>=2.4"]   # 真编码器 bge-m3；不装时用 --enc hash 跑离线测试
test = ["pytest>=8", "anyio>=4", "websockets>=12"]

[project.scripts]
towow = "host.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["host*", "jx*"]

[tool.pytest.ini_options]
markers = ["slow: 需要真 bge-m3 或长时间运行"]
