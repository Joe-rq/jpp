  <style>:root{--sea:#05080c;--text:#ede6da;--dim:#ede6da8c;--faint:#ede6da47;--sodium:#ffb35c;--ver:#ff5a36;--ash:#46505a;--blue:#d6e6ff;--serif:"Songti SC", "Noto Serif SC", "STSong", serif;--sans:"PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif}html,body{background:var(--sea);height:100%;color:var(--text);font-family:var(--sans);margin:0;overflow:hidden}#gl{cursor:grab;touch-action:none;width:100vw;height:100vh;display:block;position:fixed;inset:0}#gl:active{cursor:grabbing}#caption{max-width:min(88vw,900px);font-family:var(--serif);letter-spacing:.04em;text-align:center;color:var(--text);opacity:0;pointer-events:none;text-shadow:0 0 18px #05080ce6,0 0 2px #05080ce6;font-size:22px;line-height:1.5;transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1);position:fixed;bottom:14vh;left:50%;transform:translate(-50%,6px)}#caption.in{opacity:1;transform:translate(-50%)}#caption.out{opacity:0;transition-duration:.9s;transition-timing-function:cubic-bezier(.7,0,.84,0);transform:translate(-50%,-4px)}#stat{color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none;letter-spacing:.02em;font-size:13px;position:fixed;bottom:24px;left:28px}body.home #caption{top:15vh;bottom:auto}#home-nav{letter-spacing:.02em;z-index:3;align-items:baseline;gap:22px;font-size:14px;display:flex;position:fixed;top:22px;left:28px;right:28px}#home-nav .mark{font-family:var(--serif);color:var(--text);letter-spacing:.06em;font-size:18px}#home-nav .gap{flex:1}#home-nav .sep{width:10px}#home-nav a{color:var(--dim);text-decoration:none;transition:color .25s}#home-nav a:hover,#home-nav a.on{color:var(--text)}#home{z-index:2;pointer-events:none;width:min(660px,100vw - 112px);position:fixed;bottom:64px;left:56px}#home:before{content:"";z-index:-1;pointer-events:none;background:radial-gradient(closest-side,#05080cd1,#05080c8c 55%,#05080c00 100%);width:980px;height:680px;position:absolute;bottom:-160px;left:-220px}#home h1{font-family:var(-
