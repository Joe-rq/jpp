{key:'继续发现',title:extended.length?'这份组合，又找到新的参与者。':'把组合交给新的上下文。',text:extended.length?'他们看到的是刚刚形成的候选，而不只是最初那句“我累了”。已有的兴趣与这个候选产生了联系。':'程序继续判断哪些主体值得进一步交流，并保留未确定的可能。',duration:8000,render(){const parts=[add(el('div','packet'),el('small','','新的输入'),el('strong','',candidate.members.map(short).join(' ＋ ')+' 的候选')),el('div','down','↓'),groupPeople(extended,'值得进一步交流')];if(unknown.length){const note=el('p','unknown-note','仍未确定：');unknown.forEach((e,i)=>{if(i)note.append('、');const b=el('button','',role(e.person));b.dataset.person=e.person;note.append(b)});parts.push(note)}return parts}},
{key:'条件变化',title:'司机说：现在有时间了。',text:'最初的意图和其他人的资料都没变。这个局部变化，让已有候选可以向下一步推进。',duration:8000,updated:true,render(){const who=report.scenario.update.person,note=add(el('div','update-note'),el('small','','新的本地资料'),el('span','',report.scenario.update.context));return[add(el('div','update'),person(who,'green pulse'),note),groupPeople(updated,'可以继续讨论'),add(el('p','reuse'),el('strong','',String(revised.stats.ledger_hits)+' 个判断直接复用'),' · '+revised.stats.calls+' 次后端请求处理变化及其下游')]}}
);
scenes.push({key:'看见方法',title:'组合的结果，还能继续组合。',text:'这就是这个案例想展示的计算方法：一次发现产生的新材料，可以帮助下一次发现。',duration:8000,render(){const chain=el('div','chain');['意图','本地判断','候选组合','新的参与者'].forEach((label,i)=>{if(i)chain.append(el('i','','→'));chain.append(el('span','',label))});const results=el('div','results');for(const [label,r] of [['首次发现',cold],['相同输入复用',report.warm],['条件变化后',revised]])results.append(add(el('div','result'),el('strong','',(r.elapsed_ms/1000).toFixed(3)+' s'),el('small','',label+'\n'+r.stats.calls+' 次后端请求')));return[add(el('div','takeaway'),'一段模糊意图，经过几次局部计算，',el('em','',candidate?'长出一条合作路径。':'保留值得继续了解的可能。')),chain,results,el('p','caption',report.mode.startsWith('live')?'上方是本次真实运行的时间；动画为便于理解，放慢了播放。':'上方是离线回放耗时，不是新的模型推理速度。')]}});
let current=0,playing=false,elapsed=0,last=0,speed=1;
function progress(){const v=Math.min(100,elapsed/scenes[current].duration*100);$('bar').style.width=v+'%';$('progress').setAttribute('aria-valuenow',String(Math.round(v)))}
function render(){const s=scenes[current];$('chapter').textContent='第 '+String(current+1).padStart(2,'0')+' 步 / '+s.key;$('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');$('title').textContent=s.title;$('explanation').textContent=s.text;const fresh=el('div','scene');fresh.id='scene';s.render().forEach(p=>fresh.append(p));$('scene').replaceWith(fresh);document.querySelectorAll('.chapter-button').forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('prev').disabled=current===0;$('next').disabled=current===scenes.length-1;progress()}
function setPlaying(v){playing=v;last=performance.now();$('play').textContent=playing?'Ⅱ 暂停讲解':current===scenes.length-1&&elapsed>=scenes[current].duration?'▶ 再看一次':'▶ 播放讲解';$('play').setAttribute('aria-pressed',String(playing));$('theater').dataset.paused=String(!playing)}
function go(i){setPlaying(false);current=Math.max(0,Math.min(scenes.length-1,i));elapsed=0;render();$('scene').querySelectorAll('*').forEach(e=>e.style.animation='none');$('scene').style.animation='none'}
$('play').onclick=()=>{if(!playing&&current===scenes.length-1&&elapsed>=scenes[current].duration){current=0;elapsed=0;render()}setPlaying(!playing)};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('restart').onclick=()=>{current=0;elapsed=0;render();setPlaying(true)};$('speed').onchange=e=>{speed=Number(e.target.value)};
const shortChapter={'一个意图':'意图','遇见上下文':'相遇','转介出现':'转介','组合成材料':'组合','继续发现':'再发现','条件变化':'变化','看见方法':'方法'};
scenes.forEach((s,i)=>{const b=add(el('button','chapter-button'),el('b','',String(i+1).padStart(2,'0')),shortChapter[s.key]||s.key);b.setAttribute('aria-label','跳到第'+(i+1)+'步：'+s.key);b.onclick=()=>go(i);$('chapters').append(b)});
function frame(now){if(playing){elapsed+=Math.min(250,now-last)*speed;if(elapsed>=scenes[current].duration){if(current<scenes.length-1){current++;elapsed=0;render()}else{elapsed=scenes[current].duration;setPlaying(false)}}progress()}last=now;requestAnimationFrame(frame)}
const labels={direct:'是否能直接提供支持',relay:'是否有具体转介线索',ready:'当前时间是否确认',extend:'是否与新候选相关',activate:'是否愿意尝试或讨论'};
function details(id){setPlaying(false);const p=byId[id];if(!p)return;const changed=scenes[current].updated||current===scenes.length-1,run=changed?revised:cold;$('person-title').textContent=p.name;$('person-context').textContent=changed&&id===report.scenario.update.person?report.scenario.update.context:p.context;$('readings').replaceChildren();for(const o of run.observations.filter(o=>o.person===id))$('readings').append(add(el('div','reading'),el('strong','',labels[o.kind]||o.kind),el('span','value',' · '+(o.value===null?'未确定':o.value?'本次判断：是':'本次判断：否')),el('p','',o.question),el('small','muted','尚未校准的提名 · provisional='+o.provisional)));$('detail').showModal()}
document.addEventListener('click',e=>{const button=e.target.closest('[data-person]');if(button)details(button.dataset.person)});$('close-detail').onclick=()=>$('detail').close();people.forEach(p=>{const b=el('button','',p.name);b.dataset.person=p.id;$('people').append(b)});
$('run-info').textContent=report.mode+' · '+report.model+' · 记录时间 '+report.created_utc;if(report.benchmark){const b=report.benchmark;$('benchmark').textContent='相同的首轮八个请求：顺序 '+(b.sequential.elapsed_ms/1000).toFixed(3)+' 秒，并发 '+(b.parallel.elapsed_ms/1000).toFixed(3)+' 秒。单次观测 '+b.speedup+' 倍，网络与服务端缓存未控制。'}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlaying(false)});render();if(motionReduced){go(0);$('play-note').textContent='已尊重减少动态效果的系统设置。用上一步、下一步阅读，或播放自动翻步；不会调用模型。'}else{setPlaying(true)}requestAnimationFrame(frame);
