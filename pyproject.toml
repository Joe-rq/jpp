[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jpp-language"
version = "0.1.0a1"
description = "J++: an experimental language for composable semantic computation"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Nature"}]
dependencies = ["PyYAML>=6.0"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jpp = "jpp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"foundation.profile" = ["profiles/*.json"]
"jpp" = ["data/*.json", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
