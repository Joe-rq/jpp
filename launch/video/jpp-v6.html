<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>J++ 介绍片 v6</title>
<meta name="viewport" content="width=1920">
<style>
:root{
  --bg:#06080b; --ink:#f3f5f2; --muted:#9aaab4; --dim:#5b6b76; --line:rgba(255,255,255,.08);
  --act:#bcf479; --jev:#5fd6f5; --amber:#ffc766; --gen:#ff7ad9; --violet:#9d86ff; --slate:#7f97a6; --bad:#ff6b5a;
  --sans:"PingFang SC","Hiragino Sans GB",-apple-system,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",Menlo,Monaco,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:1920px;height:1080px;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;perspective:1800px}
.a{position:absolute;left:0;top:0}
canvas.full,svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
/* type */
.kick{font:600 17px/1 var(--mono);letter-spacing:.28em;color:var(--act);text-transform:uppercase;white-space:nowrap}
.h{font-weight:650;font-size:62px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;background:linear-gradient(180deg,#ffffff 20%,#a9bac4);-webkit-background-clip:text;background-clip:text;color:transparent}
.h em{font-style:normal;background:linear-gradient(90deg,#d9ff9e,#bcf479 40%,#5fd6f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:28px;color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.lab{font-size:20px;color:var(--muted);white-space:nowrap}
.num{font:700 88px/1 var(--mono);letter-spacing:-.04em;white-space:nowrap}
.foot{font:400 15px/1 var(--mono);color:var(--dim);white-space:nowrap;letter-spacing:.02em}
.mono{font-family:var(--mono)}
/* panels with gradient hairline border */
.panel{background:transparent;border:none;box-shadow:none}
.panel.cy{background:transparent}
.panel .ttl{position:absolute;left:22px;top:18px;font:600 15px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.dots3{display:none}
.code{font:500 21px/1.65 var(--mono);white-space:pre;color:#c8d4da}
.code .k{color:var(--act)} .code .s{color:var(--amber)} .code .f{color:var(--jev)} .code .c{color:var(--dim)}
.chip{font:500 19px/1 var(--sans);padding:10px 0;white-space:nowrap;color:var(--ink)}
.tag{font:600 15px/1 var(--mono);padding:7px 11px;border-radius:8px;white-space:nowrap;letter-spacing:.06em}
.avatar{width:170px;height:170px}
.avatar img{position:absolute;left:50%;bottom:-4%;width:92%;transform:translateX(-50%)}
.icon{background-size:contain;background-repeat:no-repeat;background-position:center}
.bubble{font-size:26px;line-height:1.5;white-space:nowrap}
#hud{position:fixed;left:12px;bottom:12px;font:12px var(--mono);color:#888;display:none;z-index:99}
</style>
<script src="data/timeline.js"></script>
<script src="data/net.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script>
"use strict";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E_ = {
  out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), sine: t => .5 - .5 * Math.cos(Math.PI * t), lin: t => t,
};
const P = (t, a, b, e = E_.out) => e(clamp((t - a) / (b - a)));
const win = (t, a, b, d = .4) => clamp((t - a) / d) * clamp((b - t) / d);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(parent, cls, css, html) { const e = document.createElement("div"); e.className = cls ? "a " + cls : "a"; if (css) Object.assign(e.style, css); if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function place(e, x, y, o = 1, s = 1, ax = 0, ay = 0, extra = "") { e.style.transform = `translate(${x}px,${y}px) translate(${-ax * 100}%,${-ay * 100}%) ${extra} scale(${s})`; e.style.opacity = o; }
function cv(parent) { const c = document.createElement("canvas"); c.className = "full"; c.width = 1920; c.height = 1080; parent.appendChild(c); return c.getContext("2d"); }
const IMG = n => `assets/cut/${n}.png`;
function img(parent, name, w, css) { const e = el(parent, "icon", { width: w + "px", height: w + "px", backgroundImage: `url(${IMG(name)})`, ...css }); return e; }
function avatar(parent, who, k) { const a = el(parent, "avatar"); const i = document.createElement("img"); i.src = IMG(`${who}-${k}`); a.appendChild(i); return a; }
function panel(parent, w, h, title, cls = "", color = "var(--act)") { const p = el(parent, "panel " + cls, { width: w + "px", height: h + "px" }); if (title) el(p, "ttl", { color }, title); el(p, "dots3", null, "<i></i><i></i><i></i>"); return p; }
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function hl(src) {
  return esc(src).replace(/("[^"]*")/g, "\u0001$1\u0002")
    .replace(/(\/\/.*)$/gm, "\u0003$1\u0004")
    .replace(/\b(let|fn|if|else|unit)\b/g, '<span class="k">$1</span>')
    .replace(/\b([a-z_]+)(?=\()/g, '<span class="f">$1</span>')
    .replace(/\u0001([^\u0002]*)\u0002/g, '<span class="s">$1</span>')
    .replace(/\u0003([^\u0004]*)\u0004/g, '<span class="c">$1</span>');
}
// headline with word-mask reveal
function head(parent, html, size) { const e = el(parent, "h", size ? { fontSize: size + "px" } : null, html); return e; }
function rev(e, t, a, b, x, y, ax = 0, ay = 0) {
  const pi = P(t, a, a + .8, E_.expo), po = P(t, b - .4, b, E_.inOut);
  e.style.clipPath = `inset(-30% ${100 - pi * 100}% -30% -3%)`;
  place(e, x + (1 - pi) * -24, y + po * -10, clamp((t - a) / .2) * (1 - po), 1, ax, ay);
  e.style.filter = po > 0 ? `blur(${po * 6}px)` : "none";
}
const fmt = v => Math.round(v).toLocaleString("en-US");

// ---------- stage & background ----------
const stage = document.getElementById("stage");
const bgc = cv(stage);
const DOTS = (() => { const a = []; for (let y = 0; y < 1080; y += 32) for (let x = 0; x < 1920; x += 32) a.push([x + 16, y + 16]); return a; })();
function renderBg(t, hue) {
  const g = bgc; g.fillStyle = "#06080b"; g.fillRect(0, 0, 1920, 1080);
  const gx = 960 + Math.sin(t * .13) * 380, gy = 120 + Math.cos(t * .11) * 60;
  let gr = g.createRadialGradient(gx, gy, 0, gx, gy, 900); gr.addColorStop(0, hue === "cy" ? "rgba(95,214,245,.16)" : "rgba(188,244,121,.13)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  gr = g.createRadialGradient(1600, 1000, 0, 1600, 1000, 800); gr.addColorStop(0, "rgba(157,134,255,.10)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  g.fillStyle = "rgba(255,255,255,.055)";
  for (const [x, y] of DOTS) { g.fillRect(x, y, 1.6, 1.6); }
  // moving beam
  const bx = ((t * 140) % 3200) - 600;
  gr = g.createLinearGradient(bx - 300, 0, bx + 300, 0); gr.addColorStop(0, "rgba(188,244,121,0)"); gr.addColorStop(.5, "rgba(188,244,121,.035)"); gr.addColorStop(1, "rgba(188,244,121,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
}

// ---------- scenes from shared timeline ----------
const TL = window.TIMELINE, BAR = 60 / TL.bpm * TL.beatsPerBar;
const DEF = {}; const scenes = []; let T0 = 0;
function S(id, def) { DEF[id] = def; }
function foot(r, text) { const e = el(r, "foot", { whiteSpace: "normal", width: "1700px", textAlign: "right", lineHeight: "1.5" }, text); return (t, dur) => place(e, 1840, 1050, win(t, .8, dur - .1, .5), 1, 1, 1); }

// JEV / J++ split mini diagram helper: J++ box, JEV box, beam dots between
function splitBoxes(r, x1, x2, y, w = 300, h = 120) {
  const a = el(r, "panel", { width: w + "px", height: h + "px" }); el(a, "ttl", { color: "var(--act)" }, "J++"); el(a, "", { position: "absolute", left: "22px", top: "52px", fontSize: "22px", color: "var(--ink)" }, "出题 · 合批 · 分路 · 记账");
  const b = el(r, "panel cy", { width: w * .8 + "px", height: h + "px" }); el(b, "ttl", { color: "var(--jev)" }, "JEV API"); el(b, "", { position: "absolute", left: "22px", top: "52px", fontSize: "22px" }, "判断 → 概率");
  const dots = Array.from({ length: 6 }, () => el(r, "", { width: "12px", height: "12px", borderRadius: "50%" }));
  return (t, o = 1) => {
    place(a, x1, y, o, 1, .5, .5); place(b, x2, y, o, 1, .5, .5);
    dots.forEach((d, i) => { const ph = ((t * .9 + i / 6) % 1); const go = i % 2 === 0; const x = go ? lerp(x1 + w / 2, x2 - w * .4, ph) : lerp(x2 - w * .4, x1 + w / 2, ph); d.style.background = go ? "var(--act)" : "var(--jev)"; d.style.boxShadow = `0 0 12px ${go ? "var(--act)" : "var(--jev)"}`; place(d, x, y + (go ? -22 : 22), o * Math.sin(ph * Math.PI), 1, .5, .5); });
  };
}

// ===== 1. JEV：问一个问题 =====
S("jev", {
  hue: "cy",
  build(r) {
    this.h = head(r, "JEV：语义判断器，返回<em>读数</em>");
    this.av = avatar(r, "owner", 0);
    this.msg = el(r, "bubble", { fontSize: "22px", color: "var(--muted)", whiteSpace: "normal", width: "560px" }, "“这台空气净化器用了不到一周就一直报警……东西你们拿回去，钱退给我就行。”");
    this.q = el(r, "bubble", { color: "var(--act)", fontSize: "34px", fontWeight: 600 }, "这条客户留言是不是在明确要求退款？");
    this.jev = panel(r, 360, 230, "JEV API", "cy", "var(--jev)");
    this.bar = el(this.jev, "", { position: "absolute", left: "24px", top: "120px", width: "312px", height: "14px", borderRadius: "7px", background: "rgba(255,255,255,.08)", overflow: "hidden" });
    this.fill = el(this.bar, "", { position: "absolute", left: 0, top: 0, bottom: 0, background: "linear-gradient(90deg,#5fd6f5,#bcf479)" });
    el(this.jev, "", { position: "absolute", left: "24px", top: "74px", fontSize: "20px", color: "var(--muted)" }, "读数 · P(是)");
    this.ans = el(this.jev, "", { position: "absolute", left: "24px", top: "158px", font: "600 26px/1 var(--sans)", color: "var(--act)" }, "是");
    this.dot = el(r, "", { width: "16px", height: "16px", borderRadius: "50%", background: "var(--act)", boxShadow: "0 0 16px var(--act)" });
    this.s1 = el(r, "num", { fontSize: "54px" }, "1.2 秒"); this.s2 = el(r, "num", { fontSize: "54px", color: "var(--act)" }, "$0.0004");
    this.l1 = el(r, "lab", null, "一次调用"); this.l2 = el(r, "lab", null, "单次调用费用");
    this.f = foot(r, "题面与留言取自 github.com/towow-ai/jpp rust/examples/guide/elem-judge.jpp · 时间与花费：JEV 实测，一份设计稿同时问 11 个问题");
  },
  update(t) {
    rev(this.h, t, .2, this.dur, 140, 120);
    place(this.av, 260, 560, P(t, .3, .8), lerp(.8, 1, P(t, .3, 1, E_.back)), .5, .5);
    place(this.msg, 400, 430, P(t, .6, 1.1), 1, 0, .5, `translateX(${(1 - P(t, .6, 1.2)) * 30}px)`);
    place(this.q, 400, 620, P(t, 1.3, 1.8), 1, 0, .5, `translateX(${(1 - P(t, 1.3, 1.9)) * 30}px)`);
    place(this.jev, 1480, 540, P(t, .8, 1.3), 1, .5, .5, `rotateY(${lerp(-22, -10, P(t, 0, this.dur, E_.sine))}deg)`);
    const f = P(t, 2.1, 3.0, E_.inOut);
    place(this.dot, lerp(980, 1300, f), lerp(620, 540, f), f > 0 && f < 1 ? 1 : 0, 1, .5, .5);
    this.fill.style.width = (P(t, 3.0, 4.2, E_.expo) * 93) + "%";
    this.ans.style.opacity = P(t, 4.0, 4.4);
    place(this.s1, 1310, 800, P(t, 4.6, 5.1), 1, 0, 0); place(this.l1, 1312, 870, P(t, 4.6, 5.1));
    place(this.s2, 1560, 800, P(t, 4.9, 5.4), 1, 0, 0); place(this.l2, 1562, 870, P(t, 4.9, 5.4));
    this.f(t, this.dur);
  }
});

// ===== 2. J++ 是什么：分工 =====
S("jpp", {
  build(r) {
    this.k = el(r, "kick", null, "J++ · 以判断为基本操作的编程语言");
    this.h = head(r, "成百上千次判断，<em>组合成一个程序</em>");
    this.jpp = panel(r, 560, 470, "J++ 的三个基本操作");
    const rows = [["材料 · mat / state", "判断的对象：文本、记录、上一步的结果"], ["题 · test / select / measure", "三种题型：是非、K 选一、打分"], ["出口 · cut / handle", "读数按线切成 act / ignore / unsure，分别接代码"]];
    this.rows = rows.map(([a, b], i) => el(this.jpp, "", { position: "absolute", left: "26px", top: 70 + i * 120 + "px", width: "508px", height: "100px" }, `<div style="position:absolute;left:0;top:10px;font-size:34px;font-weight:600;color:var(--act)">${a}</div><div style="position:absolute;left:0;top:58px;font-size:20px;color:var(--muted)">${b}</div>`));
    this.jev = panel(r, 380, 300, "JEV API", "cy", "var(--jev)");
    el(this.jev, "", { position: "absolute", left: "26px", top: "70px", fontSize: "30px", fontWeight: 600, color: "var(--jev)" }, "判断");
    el(this.jev, "", { position: "absolute", left: "26px", top: "120px", fontSize: "20px", color: "var(--muted)", lineHeight: "1.6", whiteSpace: "normal", width: "330px" }, "judge：对材料回答题，返回读数");
    this.c = cv(r);
    this.sub = el(r, "sub", null, "判断由 JEV 完成 · 批调度、出口路由、账本由 J++ 运行时完成");
  },
  update(t) {
    rev(this.k, t, .2, this.dur, 140, 110); rev(this.h, t, .4, this.dur, 140, 140);
    const o = P(t, .6, 1.2);
    place(this.jpp, 620, 590, o, 1, .5, .5, `rotateY(${lerp(16, 8, P(t, 0, this.dur, E_.sine))}deg) rotateX(4deg)`);
    this.rows.forEach((e, i) => { e.style.opacity = P(t, 1.2 + i * .45, 1.6 + i * .45); e.style.transform = `translateX(${(1 - P(t, 1.2 + i * .45, 1.8 + i * .45)) * 20}px)`; });
    place(this.jev, 1450, 560, P(t, 1.0, 1.6), 1, .5, .5, `rotateY(${lerp(-18, -9, P(t, 0, this.dur, E_.sine))}deg)`);
    // incoming question dots merge into beams toward JEV and readings return
    const g = this.c; g.clearRect(0, 0, 1920, 1080);
    const rr = rng(5);
    for (let i = 0; i < 60; i++) {
      const sy = 300 + rr() * 560, st = 2.2 + rr() * 3.2, ph = clamp((t - st) / 1.2);
      if (ph <= 0 || ph >= 1) continue;
      const x = lerp(40, 330, E_.inOut(ph)), y = lerp(sy, 590, E_.inOut(ph));
      g.fillStyle = `rgba(188,244,121,${.8 * Math.sin(ph * Math.PI)})`; g.beginPath(); g.arc(x, y, 5, 0, 6.28); g.fill();
    }
    const beamO = P(t, 3.0, 3.6) * clamp((this.dur - t) / .4);
    for (let k = 0; k < 3; k++) {
      const ph = ((t * .7 + k / 3) % 1);
      const x = lerp(910, 1255, ph), y = 520 + k * 20;
      const gr = g.createLinearGradient(x - 80, 0, x + 20, 0); gr.addColorStop(0, "rgba(188,244,121,0)"); gr.addColorStop(1, `rgba(188,244,121,${.9 * beamO})`);
      g.fillStyle = gr; g.fillRect(x - 80, y - 3, 100, 6);
      const x2 = lerp(1255, 910, ph), y2 = 640 + k * 16;
      const gr2 = g.createLinearGradient(x2 - 20, 0, x2 + 80, 0); gr2.addColorStop(0, `rgba(95,214,245,${.9 * beamO})`); gr2.addColorStop(1, "rgba(95,214,245,0)");
      g.fillStyle = gr2; g.fillRect(x2 - 20, y2 - 3, 100, 6);
    }
    g.font = "600 16px SF Mono, Menlo"; g.fillStyle = `rgba(188,244,121,${beamO})`; g.fillText("批调度：同材料多题，一次调用", 960, 492);
    g.fillStyle = `rgba(95,214,245,${beamO})`; g.fillText("读数返回", 1000, 710);
    rev(this.sub, t, 5.2, this.dur, 960, 930, .5, 0);
  }
});

// ===== 3. 八件事 =====
const EIGHT = [
  ["判断力缺席", "thing-6", 79, "判断器不可用时的处理"], ["批调度", "thing-0", 75, "同一材料的多道题合成一次调用"], ["校准", "thing-5", 65, "读数与阈值的换算依据"], ["未决去向", "thing-2", 37, "unsure 出口的处理路径"],
  ["缓存与增量", "thing-4", 33, "判过的题不再调用"], ["预算", "thing-3", 12, "调用次数与费用上限"], ["深度与终止", "thing-1", -1, "追问层数与停止条件"], ["时延预算", "thing-7", -1, "等待判断的时间上限"],
];
S("eight", {
  build(r) {
    this.h = head(r, "运行时的八项决定：<em>81 个开源项目各自手写</em>", 56);
    this.av = avatar(r, "dev", 1);
    this.cards = EIGHT.map(([name, icon, n, def], i) => {
      const c = panel(r, 540, 118, null);
      img(c, icon, 84, { position: "absolute", left: "16px", top: "17px" });
      el(c, "", { position: "absolute", left: "116px", top: "12px", fontSize: "25px", fontWeight: 600 }, name); el(c, "", { position: "absolute", left: "116px", top: "48px", fontSize: "17px", color: "var(--muted)" }, def);
      const cells = n >= 0 ? Array.from({ length: 20 }, (_, k) => el(c, "", { position: "absolute", left: 116 + k * 19.5 + "px", top: "80px", width: "11px", height: "18px", borderRadius: "3px", background: "rgba(255,255,255,.08)" })) : [];
      el(c, "", { position: "absolute", left: "440px", top: "16px", font: "600 20px/1 var(--mono)", color: n >= 0 ? "var(--act)" : "var(--dim)" }, n >= 0 ? `${n}%` : "—");
      if (n < 0) el(c, "", { position: "absolute", left: "116px", top: "80px", fontSize: "16px", color: "var(--dim)" }, "没有单独统计");
      return { c, cells, n: n >= 0 ? Math.round(n / 5) : n };
    });
    this.ex = [
      ["未决去向", "一个仓库写好了 safe_route，一次都没调用；阈值从 0.30 到 0.95，八种写法没有两个一样"],
      ["校准", "四个互不相关的项目都这样写：<br><span class='mono' style='color:var(--amber)'>if (result.noul(\"is_urgent\").isYes(0.7)) { escalate(); }</span>"],
      ["批调度", "官方 cookbook 实测：同材料多题一次调用，比逐题调用<b style='color:var(--act)'>便宜 12.2 倍、快 10 倍</b>"],
    ].map(([k, v]) => { const p = panel(r, 620, 250, "实例 · " + k, "", "var(--amber)"); el(p, "", { position: "absolute", left: "24px", top: "62px", width: "572px", fontSize: "23px", lineHeight: "1.6", whiteSpace: "normal" }, v); return p; });
    this.f = foot(r, "J++ 团队统计 2026-09-27：84 个真实开源项目，81 个有度量记录，4 个无代码副本按未出现计；按项目任一范围（判断核心或宿主）是否出现计，不是行占比 · 方法与数据见 towow-ai/jpp research/18-repetition-in-real-jev-projects.zh-CN.md · 例子：docs/evidence-from-the-wild.zh-CN.md");
  },
  update(t) {
    rev(this.h, t, .2, this.dur, 140, 90);
    this.cards.forEach((o, i) => {
      const col = i % 2, row = Math.floor(i / 2), a = .6 + i * .22;

S("scale", {

  build(r) {

    const ang = t * .12 - .3, ca = Math.cos(ang), sa = Math.sin(ang), CX = 700, CY = 600, F = 1100;
    const pr = this.p3.map(([x, y, z]) => { const X = x * ca + z * sa, Z = -x * sa + z * ca + 900; const k = F / Z; return [CX + X * k, CY + y * k * .9, k]; });

    this.st.forEach((s, i) => { const so = P(t, .8 + i * .3, 1.3 + i * .3) * clamp((this.dur - t) / .4); s.n.textContent = vals[i][0]; s.n.style.color = vals[i][2]; s.l.textContent = vals[i][1]; place(s.n, 1400, 380 + i * 170, so, 1, 0, 1); place(s.l, 1403, 392 + i * 170, so); });

  }
});
