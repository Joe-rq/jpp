name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
        working-directory: rust
      - run: cargo run --locked -p jpp-cli -- run examples/adaptive.jpp --fixtures examples/fixtures/adaptive.json
        working-directory: rust
      - run: cargo run --locked -p jpp-cli -- run examples/partial.jpp --fixtures examples/fixtures/partial.json
        working-directory: rust
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: jpp demo
      - run: python -m pytest -q
